; node32-gps-clock — NodeMCU (ESP8266) + CN-06 GPS (NEO-6M) + GC9A01 240x240

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L

; Adjust to your port (or remove both lines for auto-detection)
upload_port = COM4
monitor_port = COM4
monitor_speed = 74880          ; same speed as the ESP8266 ROM boot log
monitor_filters = esp8266_exception_decoder
upload_speed = 921600

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9   ; pinned: tested version
    mikalhart/TinyGPSPlus@^1.1.0
    olikraus/U8g2@^2.35.0          ; fonts only
